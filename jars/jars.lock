# JVM dependencies for Spark, pinned with Maven Central SHA-1s.
# Download with:  python scripts/fetch_jars.py   (jars land in this folder, git-ignored)
# build_spark() puts exactly these jars on the classpath; it never resolves
# packages at runtime (spark.jars.packages needs winutils.exe on Windows).
#
# Spark 4.3.0 (pyspark) bundles hadoop-client 3.5.0, so hadoop-aws must be 3.5.0.
# The next three lines are hadoop-aws 3.5.0's runtime dependencies.
