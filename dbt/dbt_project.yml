name: wwi
version: "0.1.0"
config-version: 2
profile: wwi          # dbt/profiles.yml (credentials from .env via scripts/run_dbt.py)

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

# Layers:
#   bronze  - loaded by Notebooks/landing_to_bronze.py, read via sources only
#   silver  - models/staging (dedup to current state) + models/intermediate (SCD2 chains)
#   gold    - models/marts (dims and facts for reporting)
#
# Schema names are used as written (see macros/generate_schema_name.sql),
# so +schema: silver builds into "silver", not "<target>_silver".
#
# Views by default: the data is small enough that table materialization buys
# nothing. The exception is models/intermediate, where the SCD2 window
# functions are expensive enough to build once.

models:
  wwi:
    +materialized: view

    staging:
      +schema: silver

    intermediate:
      +schema: silver
      +materialized: table

    marts:
      +schema: gold


